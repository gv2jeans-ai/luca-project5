<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUCA 기반 생태 탐구 프로젝트 센터</title>
    <style>
        :root {
            --primary: #2E7D32;
            --primary-light: #E8F5E9;
            --secondary: #1B5E20;
            --bg: #F4F6F8;
            --card-bg: #FFFFFF;
            --text: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--primary); margin-bottom: 8px; }
        header p { color: #666; font-size: 0.95rem; }

        .section-title { font-size: 1.1rem; font-weight: bold; margin: 20px 0 10px; color: var(--secondary); }

        /* 권역 선택 버튼 */
        .region-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        .region-btn {
            padding: 12px; border: 2px solid #ddd; background: var(--card-bg);
            border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s;
        }
        .region-btn.active, .region-btn:hover {
            border-color: var(--primary); background: var(--primary-light); color: var(--primary);
        }

        /* 과목 선택 탭 */
        .subject-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-top: 10px; }
        .tab-btn {
            padding: 10px 18px; border: none; background: #E0E0E0; border-radius: 20px;
            cursor: pointer; white-space: nowrap; font-weight: bold;
        }
        .tab-btn.active { background: var(--primary); color: white; }

        /* 차시별 카드 및 다운로드 목록 */
        .dashboard { margin-top: 25px; }
        .card {
            background: var(--card-bg); border-radius: 10px; padding: 20px; margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;
        }
        .card-info h3 { font-size: 1.05rem; margin-bottom: 6px; }
        .card-info p { font-size: 0.85rem; color: #666; }
        .card-tag { display: inline-block; padding: 3px 8px; background: #EEE; border-radius: 4px; font-size: 0.75rem; margin-right: 5px; }

        .download-btns { display: flex; gap: 8px; }
        .btn-dl {
            padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer;
            text-decoration: none; font-size: 0.85rem; font-weight: bold; display: inline-block;
        }
        .btn-plan { background: #E3F2FD; color: #1565C0; }
        .btn-guide { background: #FFF3E0; color: #E65100; }
        .btn-dl:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌱 LUCA 기반 생태 탐구 프로젝트 센터</h1>
        <p>권역 및 교과별 '앎-함-삶' 지도안 및 학생용 가이드북 다운로드 Hub</p>
    </header>

    <!-- 1. 권역 선택 -->
    <div class="section-title">1. 탐사 권역 선택</div>
    <div class="region-grid" id="regionGrid">
        <button class="region-btn active" onclick="selectRegion('경기 북부 (DMZ)')">경기 북부 (DMZ)</button>
        <button class="region-btn" onclick="selectRegion('경기 서해안 (갯벌)')">경기 서해안 (갯벌)</button>
        <button class="region-btn" onclick="selectRegion('경기 동부 (수계)')">경기 동부 (수계)</button>
        <button class="region-btn" onclick="selectRegion('경기 남부 (도심)')">경기 남부 (도심)</button>
    </div>

    <!-- 2. 교과 선택 -->
    <div class="section-title">2. 교과 선택</div>
    <div class="subject-tabs" id="subjectTabs"></div>

    <!-- 3. 차시별 자료 목록 -->
    <div class="dashboard">
        <div class="section-title" id="dashboardTitle">차시별 지도안 및 가이드북</div>
        <div id="cardList"></div>
    </div>
</div>

<script>
    // 과목 및 4개 차시별 전체 교과 데이터 세트
    const projectData = {
        "수학": [
            { step: "1차시 (앎)", title: "생물다양성 지수(Simpson)와 통계적 대푯값 이해", desc: "도심 생태 파편화 원리와 수학적 대푯값 지수 공식 이해", plan: "plan_math_1.pdf", guide: "guide_math_1.pdf" },
            { step: "2~3차시 (함-1)", title: "LUCA 앱 GPS 현장 탐사 및 교란종 데이터 수집", desc: "GPS 기반 위치 데이터 취득 및 생물종 수집 통계화", plan: "plan_math_2.pdf", guide: "guide_math_2.pdf" },
            { step: "4~5차시 (함-2)", title: "알지오매스/이지통계 활용 상관관계(산점도) 분석", desc: "수집 데이터 시각화 및 생물다양성 상관관계 도출", plan: "plan_math_3.pdf", guide: "guide_math_3.pdf" },
            { step: "6차시 (삶)", title: "통계 기반 생태 보전 정책 제안 및 발표", desc: "분석 데이터를 바탕으로 한 지자체 생태 정책 입안", plan: "plan_math_4.pdf", guide: "guide_math_4.pdf" }
        ],
        "국어": [
            { step: "1차시 (앎)", title: "생태 관련 매체 자료 분석 및 비판적 읽기", desc: "환경 문제 기사 및 매체 텍스트의 비판적 해석", plan: "plan_kor_1.pdf", guide: "guide_kor_1.pdf" },
            { step: "2~3차시 (함-1)", title: "LUCA 앱 활용 현장 취재 및 생태 기록", desc: "현장 생태 탐색 활동 인터뷰 및 취재 일지 작성", plan: "plan_kor_2.pdf", guide: "guide_kor_2.pdf" },
            { step: "4~5차시 (함-2)", title: "생태 보고서 및 공익 연설문 작성", desc: "취재 내용을 바탕으로 한 설득적 텍스트 및 보고서 작성", plan: "plan_kor_3.pdf", guide: "guide_kor_3.pdf" },
            { step: "6차시 (삶)", title: "생태 평화 연설회 및 카드뉴스 공유", desc: "작성한 공익 연설문 발표 및 카드뉴스 제작 공유", plan: "plan_kor_4.pdf", guide: "guide_kor_4.pdf" }
        ],
        "과학": [
            { step: "1차시 (앎)", title: "서식지 파편화 및 수생태계 지표종 이해", desc: "환경 변화에 따른 지표생물과 먹이사슬 영향 파악", plan: "plan_sci_1.pdf", guide: "guide_sci_1.pdf" },
            { step: "2~3차시 (함-1)", title: "LUCA 앱 GPS 기반 생물종 모니터링", desc: "현장 수생태계 지표종 모니터링 및 GPS 매핑", plan: "plan_sci_2.pdf", guide: "guide_sci_2.pdf" },
            { step: "4~5차시 (함-2)", title: "먹이그물 변형 모델링 및 서식지 분석", desc: "데이터 기반 파편화 서식지의 생태계 모델링", plan: "plan_sci_3.pdf", guide: "guide_sci_3.pdf" },
            { step: "6차시 (삶)", title: "도시 숲 생태 통로 설계안 발표 및 실천", desc: "생물다양성 보전을 위한 생태통로 구현안 제안", plan: "plan_sci_4.pdf", guide: "guide_sci_4.pdf" }
        ],
        "사회": [
            { step: "1차시 (앎)", title: "도심 생태 파편화와 공간 재개발 이해", desc: "도시화에 따른 생태계 파편화 및 사회적 영향 분석", plan: "plan_soc_1.pdf", guide: "guide_soc_1.pdf" },
            { step: "2~3차시 (함-1)", title: "LUCA 앱 활용 지역 공간 현장 조사", desc: "지역 재개발 구역 및 녹지 공간의 현장 조사", plan: "plan_soc_2.pdf", guide: "guide_soc_2.pdf" },
            { step: "4~5차시 (함-2)", title: "친환경 도시 재생 공간 기획서 작성", desc: "지속가능한 도시 생태 공간 기획 및 조례안 입안", plan: "plan_soc_3.pdf", guide: "guide_soc_3.pdf" },
            { step: "6차시 (삶)", title: "지자체 입법 청원 및 정책 발표", desc: "지자체 제출용 정책 제안서 및 입법 청원회 진행", plan: "plan_soc_4.pdf", guide: "guide_soc_4.pdf" }
        ],
        "영어": [
            { step: "1차시 (앎)", title: "글로벌 멸종위기 생물 및 기후위기 자료 분석", desc: "해외 생태 복원 사례 읽기 및 관련 영단어/표현 학습", plan: "plan_eng_1.pdf", guide: "guide_eng_1.pdf" },
            { step: "2~3차시 (함-1)", title: "LUCA 앱 활용 영문 생태 도감 작성", desc: "현장 탐사 생물종 데이터 취득 및 영문 스펙 시트 작성", plan: "plan_eng_2.pdf", guide: "guide_eng_2.pdf" },
            { step: "4~5차시 (함-2)", title: "글로벌 캠페인 영문 인포그래픽 제작", desc: "권역별 생태 문제 해결을 위한 영문 카드뉴스 및 메시지 작성", plan: "plan_eng_3.pdf", guide: "guide_eng_3.pdf" },
            { step: "6차시 (삶)", title: "세계 시민을 위한 글로벌 생태 스피치", desc: "영문 연설문 발표 및 제로웨이스트 영문 가이드북 공유", plan: "plan_eng_4.pdf", guide: "guide_eng_4.pdf" }
        ],
        "환경/도덕": [
            { step: "1차시 (앎)", title: "생명 공동체 윤리 및 세대 간 정의 이해", desc: "생태 윤리 가치관 형성 및 인간 중심주의 비판적 성찰", plan: "plan_env_1.pdf", guide: "guide_env_1.pdf" },
            { step: "2~3차시 (함-1)", title: "LUCA 앱 활용 학교 주변 비오톱 진단", desc: "서식지 연결성 평가 및 탄소발자국 현장 모니터링", plan: "plan_env_2.pdf", guide: "guide_env_2.pdf" },
            { step: "4~5차시 (함-2)", title: "학교 생태 비오톱 및 탄소중립 모델 설계", desc: "학교 및 지역사회에 적용 가능한 생태 비오톱 조성안 작성", plan: "plan_env_3.pdf", guide: "guide_env_3.pdf" },
            { step: "6차시 (삶)", title: "생태 윤리 헌장 선포 및 실천 일지 작성", desc: "생태적 삶을 위한 다짐 헌장 제정 및 구체적 실천 일지 공유", plan: "plan_env_4.pdf", guide: "guide_env_4.pdf" }
        ],
        "미술/기술가정": [
            { step: "1차시 (앎)", title: "적정기술과 저탄소 주거/식생활 이해", desc: "환경친화적 공간 디자인 및 업사이클링 미학 이해", plan: "plan_art_1.pdf", guide: "guide_art_1.pdf" },
            { step: "2~3차시 (함-1)", title: "LUCA 앱 활용 지역 생태 자원 디자인 탐색", desc: "현장 매체 및 자원 모니터링을 통한 미적/기술적 요소 수집", plan: "plan_art_2.pdf", guide: "guide_art_2.pdf" },
            { step: "4~5차시 (함-2)", title: "업사이클링 조형물 및 저탄소 레시피북 제작", desc: "정크아트 공공미술 시안 작성 및 로컬푸드 식단 디자인", plan: "plan_art_3.pdf", guide: "guide_art_3.pdf" },
            { step: "6차시 (삶)", title: "생태 공공 미술 전시 및 적정기술 제안회", desc: "산출물 공동 전시, 팝아트 포스터 공유 및 제안서 발표", plan: "plan_art_4.pdf", guide: "guide_art_4.pdf" }
        ]
    };

    let currentRegion = "경기 북부 (DMZ)";
    let currentSubject = "수학";

    // 권역 선택
    function selectRegion(regionName) {
        currentRegion = regionName;
        document.querySelectorAll('.region-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === regionName);
        });
        renderCards();
    }

    // 탭 생성 및 교과 선택
    function initTabs() {
        const tabContainer = document.getElementById('subjectTabs');
        tabContainer.innerHTML = '';
        Object.keys(projectData).forEach((subject, idx) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
            btn.innerText = subject;
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSubject = subject;
                renderCards();
            };
            tabContainer.appendChild(btn);
        });
    }

    // 카드 목록 및 다운로드 버튼 렌더링
    function renderCards() {
        const listContainer = document.getElementById('cardList');
        document.getElementById('dashboardTitle').innerText = `${currentRegion} > [${currentSubject}] 차시별 지도안 및 가이드북`;
        listContainer.innerHTML = '';

        const items = projectData[currentSubject] || [];
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-info">
                    <div><span class="card-tag">${item.step}</span></div>
                    <h3>${item.title}</h3>
                    <p>${item.desc}</p>
                </div>
                <div class="download-btns">
                    <!-- docs/ 폴더에 연결된 파일 다운로드 -->
                    <a href="docs/${item.plan}" download class="btn-dl btn-plan">📄 지도안</a>
                    <a href="docs/${item.guide}" download class="btn-dl btn-guide">📘 가이드북</a>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    // 초기화
    initTabs();
    renderCards();
</script>

</body>
</html>
