<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUCA 생태 탐사 프로그램 설계 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-card { border-color: #10b981 !important; background-color: #ecfdf5 !important; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="app-container" class="max-w-xl mx-auto min-h-screen bg-white shadow-md flex flex-col">
        <!-- 헤더 (Step 1 이상일 때만 표시) -->
        <header id="app-header" class="bg-emerald-600 text-white p-4 shadow-sm flex justify-between items-center hidden">
            <h1 class="font-bold text-lg">🌿 LUCA 생태 탐사 설계</h1>
            <span class="text-xs bg-emerald-700 px-2 py-1 rounded">교사용 모드</span>
        </header>

        <!-- Step 인디케이터 (Step 1 이상일 때만 표시) -->
        <div id="app-nav" class="bg-slate-100 p-3 border-b flex justify-between text-xs font-semibold text-slate-500 overflow-x-auto hidden">
            <span id="step-nav-1" class="text-emerald-600 font-bold">1. 학교급</span>
            <span>›</span>
            <span id="step-nav-2">2. 권역</span>
            <span>›</span>
            <span id="step-nav-3">3. 과목</span>
            <span>›</span>
            <span id="step-nav-4">4. 프로젝트</span>
            <span>›</span>
            <span id="step-nav-5">5. 전문가</span>
        </div>

        <!-- 메인 콘텐츠 영역 -->
        <main id="main-content" class="flex-1 flex flex-col"></main>

        <!-- 푸터 버튼 (Step 1 이상일 때만 표시) -->
        <footer id="footer-buttons" class="p-4 border-t bg-white flex justify-between gap-3 hidden">
            <button id="btn-prev" onclick="changeStep(-1)" class="flex-1 py-3 border rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-50 hidden">이전</button>
            <button id="btn-next" onclick="changeStep(1)" class="flex-1 py-3 bg-emerald-600 text-white rounded-xl text-sm font-bold shadow hover:bg-emerald-700">다음 단계 ></button>
        </footer>
    </div>

    <script>
        const SCHOOL_LEVELS = [
            { id: 'middle', name: '중학교', desc: '기초 생태 탐구 및 시각 자료·체험 중심 프로젝트' },
            { id: 'high', name: '고등학교', desc: '심화 데이터 분석, 학술 심층 탐구 및 입법·정책 연계 프로젝트' }
        ];

        const SUBJECTS = [
            { id: 'kor', level: 'middle', dept: '국어과', name: '국어', code: '[9국03-04]', desc: '설득하는 글쓰기, 환경 비평 및 공익광고 카피 작성' },
            { id: 'math', level: 'middle', dept: '수학과', name: '수학', code: '[9수04-08]', desc: '생태 데이터 통계 분석, 기하학적 최소 거리 분석 및 수학 모델링' },
            { id: 'eng', level: 'middle', dept: '영어과', name: '영어', code: '[9영04-02]', desc: '글로벌 연설문 작성, 영문 카드뉴스 및 친환경 가이드북 제작' },
            { id: 'sci', level: 'middle', dept: '과학과', name: '과학', code: '[9과05-04]', desc: '지표생물 관찰, 수질 오염 및 도심 서식지 파편화 영향 탐구' },
            { id: 'geo', level: 'middle', dept: '사회과', name: '사회 (지리)', code: '[9사07-02]', desc: '기후 난민 인권, 도시 재개발 공간 정비 및 자원 순환 시스템 탐구' },
            { id: 'pol', level: 'middle', dept: '사회과', name: '사회 (정치)', code: '[9사09-02]', desc: '생태계 보호 조례안 제정, 주민 참여형 공청회 및 환경권 분석' },
            { id: 'env', level: 'middle', dept: '환경과', name: '환경', code: '[9환경02-02]', desc: '생태계 건강성 진단, 비오톱 조성 및 탄소중립 실천 프로젝트' },
            { id: 'eth', level: 'middle', dept: '도덕과', name: '도덕', code: '[9도03-01]', desc: '생명 공동체 윤리 성찰, 기후 정의 실천 및 친환경 소비 윤리' },
            { id: 'art', level: 'middle', dept: '미술과', name: '미술', code: '[9미02-03]', desc: '팝아트 포스터, 공공 미술 비오톱 설계, 업사이클링 정크아트' },
            { id: 'tech', level: 'middle', dept: '기술·가정', name: '기술·가정', code: '[9기02-06]', desc: '저탄소 식단 개발, 업사이클링 패션, 스마트 그린 홈 적정기술 설계' },
            { id: 'kor_h', level: 'high', dept: '국어과', name: '공통국어', code: '[10공국02-02]', desc: '생태 심층 학술 논평 작성 및 환경 매체 비평 프로젝트' },
            { id: 'math_h', level: 'high', dept: '수학과', name: '공통수학', code: '[10공수01-03]', desc: '생태계 개체 수 변화 함수 모델링 및 수치 분석' },
            { id: 'sci_h', level: 'high', dept: '과학과', name: '통합과학', code: '[10통과05-02]', desc: '군집 생물 다양성 지수 산출 및 수생태계 변화 추적' },
            { id: 'exp_h', level: 'high', dept: '과학과', name: '과학탐구실험', code: '[10과탐01-02]', desc: '현장 시료 채취, 지표종 동정 및 실험실 정량 데이터 측정' },
            { id: 'soc_h', level: 'high', dept: '사회과', name: '통합사회', code: '[10통사02-03]', desc: '지역 환경권 분석, 생태 보전 입법 청원 및 공간 정비안 기획' },
            { id: 'his_h', level: 'high', dept: '사회과', name: '한국사', code: '[10한사03-01]', desc: '지역 생태 환경 변화의 역사적 변천 및 근대화에 따른 수계 영향 연구' }
        ];

        const ZONES = [
            { id: 'north', name: '경기 북부 접경/DMZ 권역', cities: '파주, 연천, 철원, 김포, 고양 등', desc: '생태평화, 접경지역 특유 자생 생물군집 및 교란종 모니터링' },
            { id: 'east', name: '경기 동부 남한강·산악 권역', cities: '가평, 양평, 여주, 광주, 남양주 등', desc: '한강 수계·내륙습지 생태계, 지표종 및 외래 교란종 영향 분석' },
            { id: 'west', name: '경기 서해안 갯벌·공단 권역', cities: '안산, 시흥, 화성, 평택 등', desc: '연안 습지 저서생물, 갯벌 생물다양성 및 연안 침식 복원' },
            { id: 'south', name: '경기 남부 도심·내륙 권역', cities: '수원, 용인, 성남, 안양, 부천 등', desc: '고밀도 도시화에 따른 도심 숲·하천 생태 파편화 및 다양성 지수' }
        ];

        const EXPERTS = [
            { id: 1, name: '박OO 연구원', field: '환경정책 / 입법 청원', desc: '데이터 기반 정책 제안 및 조례 청원 멘토' },
            { id: 2, name: '김OO 박사', field: '생태학 / 종 분류학', desc: '현장 생태 탐사 및 야생 동식물 동정 지도' },
            { id: 3, name: '이OO 교수', field: '생태통계학 / 데이터분석', desc: '생물 빅데이터 정제 및 종 다양성 지수 계산' },
            { id: 4, name: '최OO 작가', field: '생태 문화 / 융합예술', desc: '미디어아트, 에코 사운드 스케이프 및 콘텐츠 제작' }
        ];

        const PROJECT_MAP = {
            south: {
                sci: { title: '📌 도심 서식지 파편화에 따른 생물 다양성 감소 영향 탐구', tasks: ['도시 숲 생태 통로 설계안 작성', '생물 다양성 보전 활동 계획서 수립'] }
            }
        };

        // 초기 상태: 0은 시작화면
        let currentStep = 0;
        let selectedSchool = SCHOOL_LEVELS[0];
        let selectedZone = ZONES[3]; // 경기 남부 기본선택
        let selectedSubject = SUBJECTS[3]; // 과학 기본선택
        let selectedExpert = EXPERTS[0];
        let selectedDate = '2026-10-14';

        function getPdfFileName(type) {
            const isMiddle = selectedSchool.id === 'middle';
            if (type === 'guide') return isMiddle ? './middle_guide1.pdf' : './high_guide1.pdf';
            return isMiddle ? './middle_guide2.pdf' : './high_guide2.pdf';
        }

        function render() {
            const header = document.getElementById('app-header');
            const nav = document.getElementById('app-nav');
            const footer = document.getElementById('footer-buttons');
            const main = document.getElementById('main-content');

            // Step 0(시작화면)일 때 상단/하단 제어바 숨김
            if (currentStep === 0) {
                header.classList.add('hidden');
                nav.classList.add('hidden');
                footer.classList.add('hidden');

                main.className = "flex-1 flex flex-col justify-between p-6 bg-gradient-to-b from-emerald-500 via-emerald-600 to-teal-800 text-white text-center";
                main.innerHTML = `
                    <div class="pt-8">
                        <span class="bg-white/20 text-white text-xs px-3 py-1 rounded-full font-semibold border border-white/30">경기 남부 도심 생태 탐사</span>
                        <h1 class="text-3xl font-extrabold mt-4 tracking-tight">LUCA 생태 탐사</h1>
                        <p class="text-xs text-emerald-100 mt-2 font-light">도시화에 따른 생태 파편화와 생물다양성 지도</p>
                    </div>

                    <div class="my-6 my-auto">
                        <!-- 이미지 태그 src 부분에 원하시는 이미지 파일명(예: ./bg.jpg)을 넣으실 수 있습니다 -->
                        <div class="relative mx-auto w-full max-w-xs rounded-2xl overflow-hidden shadow-2xl border-2 border-white/20">
                            <img src="https://images.unsplash.com/photo-1511497584788-8767610419ea?auto=format&fit=crop&w=600&q=80" alt="도심 생태계 이미지" class="w-full h-52 object-cover" />
                            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent flex items-end p-4">
                                <p class="text-xs text-white text-left font-medium">우리 동네 도심 숲과 생태계를 기록하고 탐구해보세요 🌿</p>
                            </div>
                        </div>
                    </div>

                    <div class="pb-6 space-y-3">
                        <button onclick="startApp()" class="w-full py-4 bg-white text-emerald-700 font-extrabold text-base rounded-2xl shadow-lg hover:bg-emerald-50 transition transform active:scale-95">
                            🌱 탐사 설계 시작하기
                        </button>
                        <p class="text-[10px] text-emerald-200">OO중학교 과학과 시범수업 전용 시스템 v1.0</p>
                    </div>
                `;
                return;
            }

            // Step 1 이상일 때 상단/하단 제어바 표시
            header.classList.remove('hidden');
            nav.classList.remove('hidden');
            main.className = "flex-1 p-5";

            for (let i = 1; i <= 5; i++) {
                const navEl = document.getElementById(`step-nav-${i}`);
                if (navEl) navEl.className = i <= currentStep ? 'text-emerald-600 font-bold' : 'text-slate-400';
            }

            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            if (currentStep === 1) btnPrev.classList.add('hidden');
            else btnPrev.classList.remove('hidden');

            if (currentStep === 5) btnNext.innerText = '최종 예약 완료';
            else btnNext.innerText = '다음 단계 >';

            if (currentStep === 6) footer.classList.add('hidden');
            else footer.classList.remove('hidden');

            if (currentStep === 1) {
                main.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="text-lg font-bold text-slate-800">STEP 1. 학교급을 선택하세요</h2>
                        <div class="space-y-3">
                            ${SCHOOL_LEVELS.map(s => `
                                <div onclick="selectSchool('${s.id}')" class="p-4 border rounded-xl cursor-pointer transition ${selectedSchool.id === s.id ? 'active-card' : 'hover:border-slate-300'}">
                                    <h3 class="font-bold text-slate-800 text-base">${s.name}</h3>
                                    <p class="text-xs text-slate-600 mt-1">${s.desc}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentStep === 2) {
                main.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="text-lg font-bold text-slate-800">STEP 2. 탐사 권역을 선택하세요</h2>
                        <div class="space-y-2">
                            ${ZONES.map(z => `
                                <div onclick="selectZone('${z.id}')" class="p-4 border rounded-xl cursor-pointer transition ${selectedZone.id === z.id ? 'active-card' : 'hover:border-slate-300'}">
                                    <h3 class="font-bold text-slate-800">${z.name}</h3>
                                    <p class="text-xs text-emerald-600 font-medium mt-0.5">지역: ${z.cities}</p>
                                    <p class="text-xs text-slate-500 mt-1">${z.desc}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentStep === 3) {
                const filtered = SUBJECTS.filter(s => s.level === selectedSchool.id);
                main.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex justify-between items-end">
                            <div>
                                <h2 class="text-lg font-bold text-slate-800">STEP 3. 담당 과목을 선택하세요</h2>
                                <span class="text-xs text-emerald-600 font-medium">선택된 학교급: ${selectedSchool.name}</span>
                            </div>
                            <span class="text-xs text-slate-500">총 ${filtered.length}개 교과</span>
                        </div>
                        <div class="space-y-2 max-h-[440px] overflow-y-auto pr-1">
                            ${filtered.map(sub => `
                                <div onclick="selectSubject('${sub.id}')" class="p-3.5 border rounded-xl cursor-pointer transition ${selectedSubject.id === sub.id ? 'active-card' : 'hover:border-slate-300'}">
                                    <div class="flex justify-between items-center mb-1">
                                        <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">${sub.dept}</span>
                                        <span class="text-xs font-mono text-slate-400">${sub.code}</span>
                                    </div>
                                    <h3 class="font-bold text-slate-800 text-sm">${sub.name}</h3>
                                    <p class="text-xs text-slate-600 mt-0.5">${sub.desc}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentStep === 4) {
                const proj = PROJECT_MAP[selectedZone.id]?.[selectedSubject.id] || {
                    title: '📌 경기 남부 도시화에 따른 생태 파편화와 생물다양성 지수 분석',
                    tasks: ['루카 앱 활용 도심 생물 현장 탐사', '엑셀 수식 활용 종 풍부도 및 생물다양성 지수 산출', '우리 동네 숲 가꾸기 정책 제안서 작성']
                };

                const guideFile = getPdfFileName('guide');
                const studentFile = getPdfFileName('student');

                main.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="text-lg font-bold text-slate-800">STEP 4. 맞춤형 프로젝트 확인</h2>
                        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 space-y-3">
                            <div class="flex items-center space-x-2">
                                <span class="bg-emerald-600 text-white text-xs px-2 py-0.5 rounded">매칭 완료</span>
                                <h3 class="font-bold text-emerald-900 text-sm">[${selectedSchool.name}] ${selectedZone.name} x ${selectedSubject.name}</h3>
                            </div>
                            <div class="bg-white p-3.5 rounded-lg border text-sm space-y-2">
                                <p class="font-bold text-slate-800">${proj.title}</p>
                                <div class="text-xs font-semibold text-slate-500 mt-2">주요 산출물 및 활동:</div>
                                <ul class="text-xs text-slate-600 list-disc list-inside space-y-1">
                                    ${proj.tasks.map(t => `<li>${t}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="flex gap-2">
                                <a href="${guideFile}" download="${selectedSchool.name}_지도안.pdf" target="_blank" class="flex-1 bg-white border border-slate-300 text-slate-800 text-xs py-2 rounded-lg font-medium hover:bg-slate-50 text-center flex items-center justify-center">📄 지도안 다운로드</a>
                                <a href="${studentFile}" download="${selectedSchool.name}_학생용가이드.pdf" target="_blank" class="flex-1 bg-white border border-slate-300 text-slate-800 text-xs py-2 rounded-lg font-medium hover:bg-slate-50 text-center flex items-center justify-center">📱 학생용 가이드</a>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentStep === 5) {
                main.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="text-lg font-bold text-slate-800">STEP 5. 전문가 매칭 및 일정 선택</h2>
                        <div class="space-y-3">
                            <label class="block text-xs font-bold text-slate-600">지원 전문가 선택</label>
                            ${EXPERTS.map(exp => `
                                <div onclick="selectExpert(${exp.id})" class="p-3 border rounded-lg cursor-pointer transition ${selectedExpert.id === exp.id ? 'active-card' : 'hover:border-slate-300'}">
                                    <div class="font-bold text-sm">${exp.name} <span class="text-xs font-normal text-slate-500">(${exp.field})</span></div>
                                    <div class="text-xs text-slate-600">${exp.desc}</div>
                                </div>
                            `).join('')}

                            <label class="block text-xs font-bold text-slate-600 mt-4">수업 희망 일자</label>
                            <input type="date" value="${selectedDate}" onchange="selectedDate=this.value" class="w-full p-2 border rounded-lg text-sm bg-white" />
                        </div>
                    </div>
                `;
            } else if (currentStep === 6) {
                const packageFile = getPdfFileName('guide');

                main.innerHTML = `
                    <div class="text-center py-6 space-y-4">
                        <div class="text-4xl">🎉</div>
                        <h2 class="text-xl font-bold text-slate-800">프로젝트 예약 완료!</h2>
                        <p class="text-xs text-slate-500">선택하신 조건으로 수업 패키지 생성이 완료되었습니다.</p>
                        <div class="bg-slate-50 border p-4 rounded-xl text-left text-xs space-y-2">
                            <div><span class="font-bold">학교급:</span> ${selectedSchool.name}</div>
                            <div><span class="font-bold">권역:</span> ${selectedZone.name}</div>
                            <div><span class="font-bold">과목:</span> ${selectedSubject.name} (${selectedSubject.code})</div>
                            <div><span class="font-bold">전문가:</span> ${selectedExpert.name} (${selectedExpert.field})</div>
                            <div><span class="font-bold">일시:</span> ${selectedDate}</div>
                        </div>
                        <div class="space-y-2 pt-2">
                            <a href="${packageFile}" download="${selectedSchool.name}_서류패키지.pdf" target="_blank" class="block w-full bg-emerald-600 text-white text-xs py-3 rounded-xl font-bold shadow hover:bg-emerald-700 text-center">📄 행정 결재용 서류 패키지 다운로드</a>
                        </div>
                    </div>
                `;
            }
        }

        function startApp() {
            currentStep = 1;
            render();
        }

        function selectSchool(id) {
            selectedSchool = SCHOOL_LEVELS.find(s => s.id === id);
            const matchSubjects = SUBJECTS.filter(s => s.level === id);
            if (matchSubjects.length > 0) selectedSubject = matchSubjects[0];
            render();
        }

        function selectZone(id) {
            selectedZone = ZONES.find(z => z.id === id);
            render();
        }

        function selectSubject(id) {
            selectedSubject = SUBJECTS.find(s => s.id === id);
            render();
        }

        function selectExpert(id) {
            selectedExpert = EXPERTS.find(e => e.id === id);
            render();
        }

        function changeStep(delta) {
            currentStep += delta;
            if (currentStep < 1) currentStep = 1;
            if (currentStep > 6) currentStep = 6;
            render();
        }

        render();
    </script>
</body>
</html>
